name: Build firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: usb-asha
          persist-credentials: false

      - name: Check codec, SONNET button and volume
        working-directory: usb-asha
        run: |
          cc -O3 -funroll-loops -Icodec -Icodec/include tests/codec_reference.c codec/g722_encode.c -o "$RUNNER_TEMP/check-codec"
          "$RUNNER_TEMP/check-codec"
          cc -O3 -DCONFIG_USB_ASHA_SONNET3=1 -Icodec -Icodec/include tests/codec_reference.c codec/g722_encode.c -o "$RUNNER_TEMP/check-quality"
          "$RUNNER_TEMP/check-quality"
          cc -std=c11 -Wall -Werror tests/sonnet_controls.c -o "$RUNNER_TEMP/check-sonnet"
          "$RUNNER_TEMP/check-sonnet"
          cc -std=c11 -Wall -Werror -DCONFIG_USB_ASHA_POWER_BUTTON=1 tests/sonnet_controls.c -o "$RUNNER_TEMP/check-power"
          "$RUNNER_TEMP/check-power"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check timing reader
        working-directory: usb-asha
        run: python -m unittest discover -s tests -p test_timing_page.py

      - uses: zephyrproject-rtos/action-zephyr-setup@cc223fe61661d8573c1cd3f95f72f90cce729ae9 # v1.0.16
        with:
          app-path: usb-asha
          sdk-version: '0.17.4'
          toolchains: arm-zephyr-eabi
          enable-ccache: false

      - name: Build Raytac CX-40 firmware
        run: |
          (cd zephyr && git apply ../usb-asha/patches/*.patch)
          build() {
            west build -b raytac_mdbt50q_cx_40_dongle/nrf52840 -d "$1" usb-asha -- -DBUILD_VERSION=v4.2.2 "${@:2}"
          }
          build build
          build build-sonnet -DEXTRA_CONF_FILE=variants/sonnet3.conf -DEXTRA_DTC_OVERLAY_FILE=variants/sonnet3.overlay
          build build-power -DEXTRA_CONF_FILE=variants/power.conf
          build build-sonnet-power '-DEXTRA_CONF_FILE=variants/sonnet3.conf;variants/power.conf' -DEXTRA_DTC_OVERLAY_FILE=variants/sonnet3.overlay

      - name: Package and verify Nordic USB DFU image
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil \
            --output "$RUNNER_TEMP/nrfutil"
          chmod +x "$RUNNER_TEMP/nrfutil"
          "$RUNNER_TEMP/nrfutil" install nrf5sdk-tools=1.1.0
          package() {
            version=$(sed -n 's/^CONFIG_USB_ASHA_BUILD_NUMBER=//p' "$1/zephyr/.config")
            "$RUNNER_TEMP/nrfutil" nrf5sdk-tools pkg generate --hw-version 52 --sd-req 0x0102 \
              --application-version "$version" --application "$1/zephyr/zephyr.hex" "$1/$2"
            unzip -p "$1/$2" zephyr.bin | cmp - "$1/zephyr/zephyr.bin"
          }
          package build usb-asha-cx40.zip
          package build-sonnet usb-asha-sonnet3-cx40.zip
          package build-power usb-asha-power-cx40.zip
          package build-sonnet-power usb-asha-sonnet3-power-cx40.zip

      - name: Upload flashable DFU ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/usb-asha-cx40.zip
          if-no-files-found: error
          archive: false

      - name: Upload SONNET 3 DFU ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build-sonnet/usb-asha-sonnet3-cx40.zip
          if-no-files-found: error
          archive: false

      - name: Upload generic selectable-power DFU ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build-power/usb-asha-power-cx40.zip
          if-no-files-found: error
          archive: false

      - name: Upload SONNET 3 selectable-power DFU ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build-sonnet-power/usb-asha-sonnet3-power-cx40.zip
          if-no-files-found: error
          archive: false
