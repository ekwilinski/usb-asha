CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_PRODUCT="USB ASHA Audio"
CONFIG_USB_DEVICE_MANUFACTURER="USB ASHA"
CONFIG_USB_DEVICE_SOF=y
CONFIG_USB_DEVICE_AUDIO=y
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_ATT_TX_COUNT=6
CONFIG_BT_BUF_CMD_TX_COUNT=4
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_EVENTS=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4096
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2560
CONFIG_BT_RX_STACK_SIZE=2560
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_USB_NRFX_WORK_QUEUE_STACK_SIZE=2048
# The factory S113 7.2.0 occupies flash below 0x1c000. Bond storage begins at 0xf0000.
CONFIG_FLASH_LOAD_OFFSET=0x1c000
CONFIG_FLASH_LOAD_SIZE=0xd4000

CONFIG_USB_NRFX_EVT_QUEUE_SIZE=64
CONFIG_REBOOT=y

# Reserve the highest interrupt level for the Nordic controller's time-critical radio ISR.
CONFIG_ZERO_LATENCY_IRQS=y
CONFIG_BT_CTLR_ZLI=y

CONFIG_CMSIS_DSP_LOOPUNROLL=y
